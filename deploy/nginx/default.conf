# ALMIR STATISTICS — single-origin deployment:
#   /            -> React build (app/frontend, SPA fallback)
#   /api/*       -> Laravel (php-fpm)          /sanctum/* -> Laravel
#   /public/*    -> static uploads/docs of the Laravel app (frontend links ${baseURL}/public/...)
server {
    listen 80;
    server_name _;

    client_max_body_size 256m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Laravel API
    location ^~ /api/ {
        try_files $uri @laravel;
    }
    location ^~ /sanctum/ {
        try_files $uri @laravel;
    }
    location = /index.php {
        try_files $uri @laravel;
    }
    location @laravel {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_read_timeout 3600;
        fastcgi_send_timeout 3600;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 32 128k;
        fastcgi_busy_buffers_size 256k;
    }

    # Files uploaded through the app (news images, price lists, installer)
    location ^~ /public/ {
        alias /var/www/html/public/;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    # React SPA
    location ^~ /static/ {
        root /var/www/html/frontend;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location / {
        root /var/www/html/frontend;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
